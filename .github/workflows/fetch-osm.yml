name: Fetch Bucharest OSM data
on:
  push:
    branches: [bucharest-home-map]
    paths: [fetch_osm.py, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install shapely
      - name: metro
        run: timeout 900 python -u fetch_osm.py metro
        continue-on-error: true
      - name: hospitals
        run: timeout 600 python -u fetch_osm.py hospitals
        continue-on-error: true
      - name: parks
        run: timeout 900 python -u fetch_osm.py parks
        continue-on-error: true
      - name: water
        run: timeout 600 python -u fetch_osm.py water
        continue-on-error: true
      - name: shops
        run: timeout 600 python -u fetch_osm.py shops
        continue-on-error: true
      - name: roads
        run: timeout 1200 python -u fetch_osm.py roads
        continue-on-error: true
      - name: commit
        if: always()
        run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add osm/ || true
          git commit -m "Update Bucharest OSM extract (data © OpenStreetMap contributors, ODbL)" || exit 0
          git push
